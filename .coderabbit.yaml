# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit skips draft PRs by default. Review drafts too, so automated review
# lands while a PR is still being worked on (comments were arriving after triage on
# #1345/#1347, 2026-07-13). The Gemini reviewer was retired in July 2026.
reviews:
  auto_review:
    drafts: true
