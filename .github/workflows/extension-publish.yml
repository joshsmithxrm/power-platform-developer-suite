name: Publish Extension

on:
  push:
    tags:
      - "Extension-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (package only, no publish)'
        required: false
        default: true
        type: boolean
      channel:
        description: 'Release channel'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - pre-release
          - stable

permissions:
  contents: read

jobs:
  preflight:
    name: marketplace-listing-preflight
    runs-on: ubuntu-latest
    # Prong B of the AC-29 gate: re-run the listing AC tests before any
    # package or publish step, so a release triggered by direct tag push
    # (no PR) still fails fast on drift.
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/Extension-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest + pyyaml
        run: pip install pytest pyyaml

      - name: Run marketplace-listing AC tests
        run: pytest tests/extension_listing/ -v

      - name: Reject an occupied Marketplace version before starting matrix
        if: github.event_name == 'push' || !inputs.dry_run
        run: python scripts/ci/verify_release_inputs.py marketplace-vacant --tag "$GITHUB_REF_NAME"

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    # Only run on Extension-v* tags or manual dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/Extension-v')

    strategy:
      matrix:
        include:
          - target: win32-x64
            rid: win-x64
          - target: linux-x64
            rid: linux-x64
          - target: darwin-x64
            rid: osx-x64
          - target: darwin-arm64
            rid: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0  # Required for MinVer to find the co-release Cli-v* tag
          fetch-tags: true

      - name: Resolve release tag SHA
        id: resolve-tag
        run: |
          if [[ "${{ github.ref }}" != refs/tags/Extension-v* ]]; then
            echo "::error::Publish requires a refs/tags/Extension-v* ref. Got: ${{ github.ref }}"
            exit 1
          fi
          sha="$(git rev-list -n 1 ${{ github.ref }})"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to resolve a 40-char commit SHA for ${{ github.ref }}. Got: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Python for release input guard
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Resolve bundled CLI release
        id: resolve-cli
        run: |
          python scripts/ci/verify_release_inputs.py resolve-cli --tag "$GITHUB_REF_NAME" --source "${{ steps.resolve-tag.outputs.sha }}" --output bundled-cli.json
          python -c 'import json,os; f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("version="+json.load(open("bundled-cli.json"))["version"]+"\n"); f.close()'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/PPDS.Extension/package-lock.json

      - name: Install dependencies
        working-directory: src/PPDS.Extension
        run: npm ci

      - name: Typecheck
        working-directory: src/PPDS.Extension
        run: npm run typecheck:all

      - name: Lint
        working-directory: src/PPDS.Extension
        run: npm run lint

      - name: Test
        working-directory: src/PPDS.Extension
        run: npm test

      - name: Build
        working-directory: src/PPDS.Extension
        run: npm run compile

      - name: Bundle CLI for ${{ matrix.target }}
        working-directory: src/PPDS.Extension
        run: npm run bundle:cli -- --rid ${{ matrix.rid }} --expected-version "${{ steps.resolve-cli.outputs.version }}"

      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_prerelease=${{ inputs.channel == 'pre-release' }}" >> $GITHUB_OUTPUT
          else
            # Infer channel from tag version: odd minor = pre-release, even minor = stable
            TAG="${{ github.ref_name }}"
            MINOR=$(echo "$TAG" | sed -E 's/Extension-v[0-9]+\.([0-9]+)\..*/\1/')
            if ! [[ "$MINOR" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not parse minor version from tag $TAG"
              exit 1
            fi
            if (( MINOR % 2 == 1 )); then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Package extension (pre-release)
        if: steps.channel.outputs.is_prerelease == 'true'
        working-directory: src/PPDS.Extension
        run: npx vsce package --target ${{ matrix.target }} --pre-release --out ppds-${{ matrix.target }}.vsix --baseImagesUrl https://raw.githubusercontent.com/joshsmithxrm/power-platform-developer-suite/${{ steps.resolve-tag.outputs.sha }}/src/PPDS.Extension/media/

      - name: Package extension (stable)
        if: steps.channel.outputs.is_prerelease != 'true'
        working-directory: src/PPDS.Extension
        run: npx vsce package --target ${{ matrix.target }} --out ppds-${{ matrix.target }}.vsix --baseImagesUrl https://raw.githubusercontent.com/joshsmithxrm/power-platform-developer-suite/${{ steps.resolve-tag.outputs.sha }}/src/PPDS.Extension/media/

      - name: Validate exact packaged VSIX before upload
        run: >-
          python scripts/ci/verify_release_inputs.py vsix
          --tag "$GITHUB_REF_NAME"
          --cli-version "${{ steps.resolve-cli.outputs.version }}"
          --source "${{ steps.resolve-tag.outputs.sha }}"
          --target "${{ matrix.target }}"
          --channel "${{ steps.channel.outputs.is_prerelease }}"
          --extension-root src/PPDS.Extension
          --path src/PPDS.Extension/ppds-${{ matrix.target }}.vsix

      - name: Recheck target vacancy before upload
        if: github.event_name == 'push' || !inputs.dry_run
        run: python scripts/ci/verify_release_inputs.py marketplace-vacant --tag "$GITHUB_REF_NAME" --target "${{ matrix.target }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-vsix-${{ matrix.target }}
          path: src/PPDS.Extension/ppds-${{ matrix.target }}.vsix
          retention-days: 30

      - name: Publish to VS Code Marketplace (pre-release)
        if: |
          steps.channel.outputs.is_prerelease == 'true' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        working-directory: src/PPDS.Extension
        run: npx vsce publish --packagePath ppds-${{ matrix.target }}.vsix --pre-release
        env:
          VSCE_PAT: ${{ secrets.ADO_MARKETPLACE_PAT }}

      - name: Publish to VS Code Marketplace (stable)
        if: |
          steps.channel.outputs.is_prerelease != 'true' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        working-directory: src/PPDS.Extension
        run: npx vsce publish --packagePath ppds-${{ matrix.target }}.vsix
        env:
          VSCE_PAT: ${{ secrets.ADO_MARKETPLACE_PAT }}

  verify-public-artifacts:
    name: Verify public Marketplace artifacts
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Resolve bundled CLI release
        id: resolve-cli
        shell: bash
        run: |
          sha="$(git rev-list -n 1 "$GITHUB_REF")"
          python scripts/ci/verify_release_inputs.py resolve-cli --tag "$GITHUB_REF_NAME" --source "$sha" --output bundled-cli.json
          python -c 'import json,os; f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("version="+json.load(open("bundled-cli.json"))["version"]+"\n"); f.close()'

      - name: Verify all public Marketplace targets
        run: >-
          python scripts/ci/verify_public_release.py
          marketplace
          --tag "$GITHUB_REF_NAME"
          --cli-version "${{ steps.resolve-cli.outputs.version }}"
