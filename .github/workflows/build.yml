name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**.cs'
              - '**.csproj'
              - '**.sln'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - 'src/PPDS.Extension/**'
            extension:
              - 'src/PPDS.Extension/**'
              - '.github/workflows/build.yml'

  # Dependency review for PRs - checks for vulnerabilities in dependency changes
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Allow existing vulnerabilities, only fail on new ones
          deny-licenses: ''

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Required for MinVer to read git history

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/http-cache
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'nuget.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Check for vulnerable packages
      shell: pwsh
      run: |
        # Run vulnerability check - capture output and exit code separately
        # Note: dotnet list package can crash with CLR errors on some SDK versions
        $output = dotnet list package --vulnerable --include-transitive 2>&1
        $dotnetExitCode = $LASTEXITCODE
        $output | Write-Host

        # Handle CLR crashes or other unexpected failures gracefully
        if ($dotnetExitCode -ne 0 -and $output -notmatch "has the following vulnerable packages") {
          Write-Host ""
          Write-Host "::warning::Vulnerable package check exited with code $dotnetExitCode (possible SDK bug, continuing)"
        }
        elseif ($output -match "has the following vulnerable packages") {
          Write-Host ""
          Write-Host "::warning::Vulnerable packages detected - review security advisories above"
          # Note: Not failing the build to avoid blocking on transitive dependencies
          # that require upstream fixes. Dependency-review-action will catch new vulns.
        }
        else {
          Write-Host "No known vulnerabilities found in packages"
        }

        # Always succeed - vulnerability blocking is handled by dependency-review-action
        exit 0

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: |
          src/PPDS.Plugins/bin/Release/*.nupkg
          src/PPDS.Plugins/bin/Release/*.snupkg
        if-no-files-found: warn

  # Extension build (TypeScript)
  extension:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/PPDS.Extension/package-lock.json

      - name: Install dependencies
        working-directory: src/PPDS.Extension
        run: npm ci

      - name: Typecheck
        working-directory: src/PPDS.Extension
        run: npm run typecheck:all

      - name: Lint
        working-directory: src/PPDS.Extension
        run: npm run lint

      # Production-only vulnerability gate. Blocks CI on `high` or `critical`
      # advisories in shipped (non-dev) dependencies. Moderate-and-below are
      # intentionally not blocking (too noisy on transitive churn).
      # Dev-dep advisories are handled by dependabot PRs, not CI.
      - name: npm audit (production)
        working-directory: src/PPDS.Extension
        run: npm audit --omit=dev --audit-level=high

      # Dead-code detection (knip) — non-blocking advisory for now (Workstream L5).
      # Flip `continue-on-error` to false once the backlog of unused exports is cleared.
      - name: Dead-code check (advisory)
        working-directory: src/PPDS.Extension
        run: npm run dead-code
        continue-on-error: true

      - name: Build
        working-directory: src/PPDS.Extension
        run: npm run compile

      - name: Test
        working-directory: src/PPDS.Extension
        run: npm test

  # Monitored ramp for issue #1267. Remove continue-on-error after both matrix
  # lanes pass three consecutive runs (PR + main) without using the startup retry.
  # build-status already consumes this result, so removal makes the suite blocking.
  extension-e2e:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        vscode-version: [minimum, stable]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/PPDS.Extension/package-lock.json

      - name: Install dependencies
        working-directory: src/PPDS.Extension
        run: npm ci

      - name: Run Extension E2E tests
        id: e2e
        working-directory: src/PPDS.Extension
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run test:e2e
        continue-on-error: true
        env:
          VSCODE_E2E_VERSION: ${{ matrix.vscode-version }}

      - name: Upload E2E diagnostics
        uses: actions/upload-artifact@v7
        if: steps.e2e.outcome == 'failure'
        with:
          name: extension-e2e-${{ matrix.vscode-version }}
          path: |
            src/PPDS.Extension/playwright-report/
            src/PPDS.Extension/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Report monitored-ramp failure
        if: steps.e2e.outcome == 'failure'
        run: echo "::warning::Extension E2E failed during the monitored ramp; diagnostics were uploaded."

  # Gate job for branch protection
  build-status:
    runs-on: ubuntu-latest
    needs: [changes, build, extension, extension-e2e]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Changes detection failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" == "success" || "${{ needs.build.result }}" == "skipped" ]] && \
             [[ "${{ needs.extension.result }}" == "success" || "${{ needs.extension.result }}" == "skipped" ]] && \
             [[ "${{ needs.extension-e2e.result }}" == "success" || "${{ needs.extension-e2e.result }}" == "skipped" ]]; then
            echo "Build passed"
            exit 0
          else
            echo "Build failed: build=${{ needs.build.result }}, extension=${{ needs.extension.result }}, extension-e2e=${{ needs.extension-e2e.result }}"
            exit 1
          fi
