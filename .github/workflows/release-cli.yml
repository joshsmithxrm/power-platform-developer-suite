name: Release CLI Binaries

on:
  push:
    tags:
      - 'Cli-v*'

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: ppds-win-x64.exe
          - rid: win-arm64
            os: windows-11-arm
            artifact: ppds-win-arm64.exe
          - rid: osx-x64
            os: macos-15-intel
            artifact: ppds-osx-x64
          - rid: osx-arm64
            os: macos-15
            artifact: ppds-osx-arm64
          - rid: linux-x64
            os: ubuntu-latest
            artifact: ppds-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for MinVer to read git history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.427
            10.0.114

      - name: Publish self-contained binary
        run: |
          dotnet publish src/PPDS.Cli/PPDS.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -f net8.0 \
            -p:PublishSingleFile=true \
            --self-contained \
            -o ./publish
        shell: bash

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build deterministic local plugin fixture
        run: dotnet build tests/fixtures/SingleFilePlugin/SingleFilePlugin.csproj -c Release

      - name: Build read-only cache location probe
        run: dotnet build tests/fixtures/ReferenceCacheProbe/ReferenceCacheProbe.csproj -c Release

      - name: Verify extraction before uploading release binary
        shell: bash
        run: |
          binary=./publish/ppds
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary+=.exe; fi
          python scripts/ci/smoke_single_file_extraction.py \
            --binary "$binary" \
            --fixture tests/fixtures/SingleFilePlugin/bin/Release/net462 \
            --cache-probe tests/fixtures/ReferenceCacheProbe/bin/Release/net8.0/ReferenceCacheProbe.dll \
            --reference-archive src/PPDS.Cli/obj/Release/net8.0/${{ matrix.rid }}/Net462ReferenceAssemblies.zip

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv ./publish/ppds ./publish/${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv ./publish/ppds.exe ./publish/${{ matrix.artifact }}
        shell: bash

      - name: Verify native binary version before upload
        shell: bash
        run: python scripts/ci/verify_release_inputs.py binary --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --path ./publish/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.artifact }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout reviewed release inputs
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Python for release input guard
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p ./release
          # Move all binaries to release folder (artifacts are in subdirectories)
          find ./artifacts -type f -name "ppds-*" -exec mv {} ./release/ \;
          ls -la ./release/

      - name: Validate all binaries present
        run: |
          EXPECTED="ppds-win-x64.exe ppds-win-arm64.exe ppds-osx-x64 ppds-osx-arm64 ppds-linux-x64"
          for binary in $EXPECTED; do
            if [ ! -f "./release/$binary" ]; then
              echo "ERROR: Missing expected binary: $binary"
              exit 1
            fi
          done
          echo "All 5 platform binaries present"

      - name: Generate checksums
        working-directory: ./release
        run: |
          sha256sum ppds-* > checksums.sha256
          cat checksums.sha256

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#Cli-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Validate release vacancy or owned draft and prepare curated notes
        id: release-plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/ci/verify_release_inputs.py cli-plan \
            --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --changelog src/PPDS.Cli/CHANGELOG.md --directory ./release \
            --output release-plan.json --notes release-notes.md
          python -c 'import json,os; p=json.load(open("release-plan.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("existing_draft="+str(p["existing_draft"]).lower()+"\n"); f.close()'

      # A known draft may resume only after matching ownership, notes and bytes.
      - name: Create workflow-owned draft with curated notes
        if: steps.release-plan.outputs.existing_draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          case "${{ steps.version.outputs.version }}" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft --verify-tag --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            --title "PPDS CLI v${{ steps.version.outputs.version }}" \
            $PRERELEASE_FLAG

      - name: Upload only missing validated assets without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset_list=$(python -c 'import json; print("\n".join(json.load(open("release-plan.json"))["missing_assets"]))')
          if [[ -n "$asset_list" ]]; then
            mapfile -t assets <<< "$asset_list"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
          fi

      - name: Verify complete draft after uploads and before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/verify_release_inputs.py cli-plan
          --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --changelog src/PPDS.Cli/CHANGELOG.md --directory ./release
          --output complete-release-plan.json --notes release-notes.md --require-complete

      - name: Publish verified workflow-owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${{ steps.version.outputs.tag }}" --draft=false

  verify-public-release:
    name: Verify public GitHub release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify assets from public GitHub release
        run: >-
          python scripts/ci/verify_public_release.py
          github
          --tag "$GITHUB_REF_NAME"
