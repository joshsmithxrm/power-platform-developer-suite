name: Label Dependabot Major Updates

on:
  # Label writes need a base-repository token. Run trusted code from the base
  # commit and never checkout or execute the Dependabot head revision here.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  label-major-updates:
    runs-on: ubuntu-latest
    # Key off PR ownership rather than the synchronizing actor so a maintainer
    # rebase still reconciles a Dependabot PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Classify update and apply evaluation label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ci/label_major_dependency.py --pr "$PR_NUMBER"
