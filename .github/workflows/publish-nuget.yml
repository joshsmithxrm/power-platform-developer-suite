name: Publish to NuGet

on:
  push:
    tags:
      - 'Plugins-v*'
      - 'Dataverse-v*'
      - 'Migration-v*'
      - 'Auth-v*'
      - 'Cli-v*'
      - 'Query-v*'
      - 'Mcp-v*'

permissions:
  contents: read

jobs:
  build-package:
    name: Build and validate NuGet package
    if: >-
      github.repository == 'joshsmithxrm/power-platform-developer-suite' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      (startsWith(github.ref, 'refs/tags/Plugins-v') ||
       startsWith(github.ref, 'refs/tags/Dataverse-v') ||
       startsWith(github.ref, 'refs/tags/Migration-v') ||
       startsWith(github.ref, 'refs/tags/Auth-v') ||
       startsWith(github.ref, 'refs/tags/Cli-v') ||
       startsWith(github.ref, 'refs/tags/Query-v') ||
       startsWith(github.ref, 'refs/tags/Mcp-v'))
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      package: ${{ steps.package.outputs.package }}
      artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.package-artifact.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.handoff.outputs.manifest-sha256 }}

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0  # Required for MinVer to read git history
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Determine package to publish
      id: package
      shell: bash
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        if [[ $TAG == Plugins-v* ]]; then
          echo "package=PPDS.Plugins" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Plugins/PPDS.Plugins.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Dataverse-v* ]]; then
          echo "package=PPDS.Dataverse" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Dataverse/PPDS.Dataverse.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Migration-v* ]]; then
          echo "package=PPDS.Migration" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Migration/PPDS.Migration.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Auth-v* ]]; then
          echo "package=PPDS.Auth" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Auth/PPDS.Auth.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Cli-v* ]]; then
          echo "package=PPDS.Cli" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Cli/PPDS.Cli.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Query-v* ]]; then
          echo "package=PPDS.Query" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Query/PPDS.Query.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Mcp-v* ]]; then
          echo "package=PPDS.Mcp" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Mcp/PPDS.Mcp.csproj" >> $GITHUB_OUTPUT
        else
          echo "Unknown tag format: $TAG"
          exit 1
        fi

    - name: Show version info
      shell: bash
      run: |
        echo "Tag: ${{ steps.package.outputs.tag }}"
        echo "Package: ${{ steps.package.outputs.package }}"
        echo "Projects: ${{ steps.package.outputs.projects }}"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Decode Plugins signing key
      # Only for Plugins-v* releases — decode the real private key from the
      # PLUGINS_SNK_BASE64 secret so pack can produce a signed assembly.
      # Written to RUNNER_TEMP (outside the workspace) so the key cannot be
      # captured by any actions/upload-artifact glob, gets wiped when the job
      # ends, and is never near the repo tree where a stray `git add` could
      # commit it. The real .snk is NEVER committed.
      if: startsWith(github.ref, 'refs/tags/Plugins-v')
      shell: bash
      env:
        PLUGINS_SNK_BASE64: ${{ secrets.PLUGINS_SNK_BASE64 }}
      run: |
        if [ -z "$PLUGINS_SNK_BASE64" ]; then
          echo "::error::PLUGINS_SNK_BASE64 secret is not set — cannot sign Plugins release"
          exit 1
        fi
        SNK_PATH="$RUNNER_TEMP/PPDS.Plugins.snk"
        echo "$PLUGINS_SNK_BASE64" | base64 -d > "$SNK_PATH"
        size=$(stat -c%s "$SNK_PATH")
        echo "::notice::Decoded Plugins signing key ($size bytes) to runner temp"
        if [ "$size" -lt 500 ]; then
          echo "::error::Decoded key is unexpectedly small — secret may be corrupted"
          exit 1
        fi
        # Export the path for the pack step. RUNNER_TEMP differs per job/runner.
        echo "PLUGINS_SNK_PATH=$SNK_PATH" >> "$GITHUB_ENV"

    - name: Pack specific projects
      shell: bash
      run: |
        mkdir -p ./nupkgs
        for project in ${{ steps.package.outputs.projects }}; do
          echo "Packing $project"
          if [[ "$project" == *PPDS.Plugins* ]]; then
            # Re-pack Plugins with PublicSign=false + real key so the published
            # assembly carries a real strong-name signature, not just public.
            # Key path comes from RUNNER_TEMP (set by the decode step) so the
            # private key never enters the workspace tree.
            dotnet pack "$project" --configuration Release --output ./nupkgs \
              -p:PublicSign=false \
              -p:AssemblyOriginatorKeyFile="$PLUGINS_SNK_PATH"
          else
            dotnet pack "$project" --configuration Release --no-build --output ./nupkgs
          fi
        done

    - name: Setup Python for release input guard
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Validate packages and public version vacancy before upload
      shell: bash
      run: python scripts/ci/verify_release_inputs.py nuget --tag "$GITHUB_REF_NAME" --directory ./nupkgs

    - name: List packages
      shell: bash
      run: ls -la ./nupkgs/

    - name: Bind validated packages to this source, run and build job
      id: handoff
      shell: bash
      run: >-
        python -I scripts/ci/verify_nuget_handoff.py create --directory ./nupkgs
        --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
        --attempt "$GITHUB_RUN_ATTEMPT"

    - name: Retain only validated package data
      id: package-artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: |
          nupkgs/*.nupkg
          nupkgs/*.snupkg
          nupkgs/nuget-handoff.json
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: build-package
    if: >-
      github.repository == 'joshsmithxrm/power-platform-developer-suite' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      (startsWith(github.ref, 'refs/tags/Plugins-v') ||
       startsWith(github.ref, 'refs/tags/Dataverse-v') ||
       startsWith(github.ref, 'refs/tags/Migration-v') ||
       startsWith(github.ref, 'refs/tags/Auth-v') ||
       startsWith(github.ref, 'refs/tags/Cli-v') ||
       startsWith(github.ref, 'refs/tags/Query-v') ||
       startsWith(github.ref, 'refs/tags/Mcp-v'))
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      tag: ${{ steps.verify-handoff.outputs.tag }}
      package: ${{ steps.verify-handoff.outputs.package }}
    steps:
    - name: Checkout only the source-pinned data verifier
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: scripts/ci/verify_nuget_handoff.py
        sparse-checkout-cone-mode: false
    - name: Setup NuGet upload CLI
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    - name: Setup data verifier
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Download this run's exact package artifact
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.build-package.outputs.artifact-id }}
        path: ${{ runner.temp }}/nuget-publish
        merge-multiple: true
    - name: Verify source, producer job, package hashes, tag and vacancy without MSBuild
      id: verify-handoff
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HANDOFF_ARTIFACT_ID: ${{ needs.build-package.outputs.artifact-id }}
        HANDOFF_ARTIFACT_DIGEST: ${{ needs.build-package.outputs.artifact-digest }}
        HANDOFF_MANIFEST_SHA256: ${{ needs.build-package.outputs.manifest-sha256 }}
      run: >-
        python -I scripts/ci/verify_nuget_handoff.py verify --directory "$RUNNER_TEMP/nuget-publish"
        --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
        --attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$HANDOFF_ARTIFACT_ID"
        --artifact-digest "$HANDOFF_ARTIFACT_DIGEST" --manifest-sha "$HANDOFF_MANIFEST_SHA256"
        --output "$RUNNER_TEMP/verified-nuget-handoff.json"

    - name: Validate trusted publishing identity
      shell: bash
      env:
        NUGET_PUBLISH_USER: JoshSmithMSFT
      run: |
        # This must be the individual policy creator, not its package owner.
        if [[ -z "${NUGET_PUBLISH_USER:-}" || ! "$NUGET_PUBLISH_USER" =~ ^[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::The publishing identity must be the confirmed individual NuGet policy creator."
          exit 1
        fi

    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: JoshSmithMSFT

    - name: Push packages to NuGet
      working-directory: ${{ runner.temp }}
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        for package in "$RUNNER_TEMP"/nuget-publish/*.nupkg; do
          echo "Pushing $package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --no-symbols
        done

    - name: Push symbols to NuGet
      working-directory: ${{ runner.temp }}
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        shopt -s nullglob
        for package in "$RUNNER_TEMP"/nuget-publish/*.snupkg; do
          echo "Pushing $package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        done
      continue-on-error: true

  verify-public-artifact:
    name: Verify public NuGet artifact
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Checkout release verifier
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Verify package from public NuGet
      shell: bash
      run: >-
        python scripts/ci/verify_public_release.py
        nuget
        --tag "${{ needs.publish.outputs.tag }}"
        --package "${{ needs.publish.outputs.package }}"
