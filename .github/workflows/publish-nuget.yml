name: Publish to NuGet

on:
  push:
    tags:
      - 'Plugins-v*'
      - 'Dataverse-v*'
      - 'Migration-v*'
      - 'Auth-v*'
      - 'Cli-v*'
      - 'Query-v*'
      - 'Mcp-v*'

permissions:
  contents: read

jobs:
  build-package:
    name: Build and validate NuGet package
    if: >-
      github.repository == 'joshsmithxrm/power-platform-developer-suite' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      (startsWith(github.ref, 'refs/tags/Plugins-v') ||
       startsWith(github.ref, 'refs/tags/Dataverse-v') ||
       startsWith(github.ref, 'refs/tags/Migration-v') ||
       startsWith(github.ref, 'refs/tags/Auth-v') ||
       startsWith(github.ref, 'refs/tags/Cli-v') ||
       startsWith(github.ref, 'refs/tags/Query-v') ||
       startsWith(github.ref, 'refs/tags/Mcp-v'))
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      package: ${{ steps.package.outputs.package }}
      artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.package-artifact.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.handoff.outputs.manifest-sha256 || steps.keyless.outputs.manifest-sha256 }}

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0  # Required for MinVer to read git history
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Determine package to publish
      id: package
      shell: bash
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        if [[ $TAG == Plugins-v* ]]; then
          echo "package=PPDS.Plugins" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Plugins/PPDS.Plugins.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Dataverse-v* ]]; then
          echo "package=PPDS.Dataverse" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Dataverse/PPDS.Dataverse.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Migration-v* ]]; then
          echo "package=PPDS.Migration" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Migration/PPDS.Migration.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Auth-v* ]]; then
          echo "package=PPDS.Auth" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Auth/PPDS.Auth.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Cli-v* ]]; then
          echo "package=PPDS.Cli" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Cli/PPDS.Cli.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Query-v* ]]; then
          echo "package=PPDS.Query" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Query/PPDS.Query.csproj" >> $GITHUB_OUTPUT
        elif [[ $TAG == Mcp-v* ]]; then
          echo "package=PPDS.Mcp" >> $GITHUB_OUTPUT
          echo "projects=src/PPDS.Mcp/PPDS.Mcp.csproj" >> $GITHUB_OUTPUT
        else
          echo "Unknown tag format: $TAG"
          exit 1
        fi

    - name: Show version info
      shell: bash
      run: |
        echo "Tag: ${{ steps.package.outputs.tag }}"
        echo "Package: ${{ steps.package.outputs.package }}"
        echo "Projects: ${{ steps.package.outputs.projects }}"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/Plugins-v* ]]; then
          dotnet build src/PPDS.Plugins/PPDS.Plugins.csproj --configuration Release --no-restore -p:PublicSign=false -p:DelaySign=true
        else
          dotnet build --configuration Release --no-restore
        fi

    - name: Pack specific projects
      shell: bash
      run: |
        mkdir -p ./nupkgs
        for project in ${{ steps.package.outputs.projects }}; do
          echo "Packing $project"
          if [[ "$project" == *PPDS.Plugins* ]]; then
            dotnet pack "$project" --configuration Release --no-build --output ./nupkgs -p:PublicSign=false -p:DelaySign=true
          else
            dotnet pack "$project" --configuration Release --no-build --output ./nupkgs
          fi
        done

    - name: Setup Python for release input guard
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Validate packages and public version vacancy before upload
      if: ${{ !startsWith(github.ref, 'refs/tags/Plugins-v') }}
      shell: bash
      run: python scripts/ci/verify_release_inputs.py nuget --tag "$GITHUB_REF_NAME" --directory ./nupkgs

    - name: List packages
      shell: bash
      run: ls -la ./nupkgs/

    - name: Bind validated packages to this source, run and build job
      if: ${{ !startsWith(github.ref, 'refs/tags/Plugins-v') }}
      id: handoff
      shell: bash
      run: >-
        python -I scripts/ci/verify_nuget_handoff.py create --directory ./nupkgs
        --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
        --attempt "$GITHUB_RUN_ATTEMPT"

    - name: Bind keyless Plugins input without release clearance
      if: startsWith(github.ref, 'refs/tags/Plugins-v')
      id: keyless
      shell: bash
      run: >-
        python -I scripts/ci/verify_plugin_signing.py prepare --directory ./nupkgs
        --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

    - name: Retain only validated package data
      id: package-artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ startsWith(github.ref, 'refs/tags/Plugins-v') && 'nuget-keyless' || 'nuget-package' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: |
          nupkgs/*.nupkg
          nupkgs/*.snupkg
          nupkgs/nuget-handoff.json
        if-no-files-found: error
        retention-days: 1

  sign-plugins:
    name: Sign Plugins assembly
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/Plugins-v')
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.signed-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.signed-artifact.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.receipt.outputs.manifest-sha256 }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          scripts/ci/sign_plugin_assembly.ps1
          scripts/ci/verify_plugin_signing.py
          scripts/ci/verify_nuget_handoff.py
          scripts/ci/inspect_release_assemblies.ps1
          scripts/ci/plugin-signing-policy.json
          src/PPDS.Plugins/PPDS.Plugins.PublicKey
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Refuse unapproved signing policy before secret selection
      shell: bash
      run: python -I scripts/ci/verify_plugin_signing.py policy
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.build-package.outputs.artifact-id }}
        path: ${{ runner.temp }}/plugins-keyless
        merge-multiple: true
    - name: Admit exact keyless artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_ID: ${{ needs.build-package.outputs.artifact-id }}
        BUILD_DIGEST: ${{ needs.build-package.outputs.artifact-digest }}
        BUILD_MANIFEST: ${{ needs.build-package.outputs.manifest-sha256 }}
      run: >-
        python -I scripts/ci/verify_plugin_signing.py admit --directory "$RUNNER_TEMP/plugins-keyless"
        --output "$RUNNER_TEMP/plugins-admitted" --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA"
        --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$BUILD_ID"
        --artifact-digest "$BUILD_DIGEST" --manifest-sha "$BUILD_MANIFEST"
    - name: Create fresh signed output directory
      shell: pwsh
      run: New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/plugins-signed" -ErrorAction Stop | Out-Null
    - name: Sign only the admitted assembly
      shell: pwsh
      env:
        PLUGINS_SNK_BASE64: ${{ secrets.PLUGINS_SNK_BASE64 }}
      run: >-
        ./scripts/ci/sign_plugin_assembly.ps1
        -InputDll "$env:RUNNER_TEMP/plugins-admitted/PPDS.Plugins.dll"
        -OutputDll "$env:RUNNER_TEMP/plugins-signed/PPDS.Plugins.dll"
        -Policy "$env:GITHUB_WORKSPACE/scripts/ci/plugin-signing-policy.json"
        -Request "$env:RUNNER_TEMP/plugins-admitted/signing-request.json"
        -PublicKey "$env:GITHUB_WORKSPACE/src/PPDS.Plugins/PPDS.Plugins.PublicKey"
        -Receipt "$env:RUNNER_TEMP/plugins-signed/signing-receipt.json"
    - name: Bind completed signing receipt after key cleanup
      id: receipt
      shell: pwsh
      run: |
        $receiptHash = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/plugins-signed/signing-receipt.json" -Algorithm SHA256).Hash.ToLowerInvariant()
        "manifest-sha256=$receiptHash" >> $env:GITHUB_OUTPUT
    - uses: actions/upload-artifact@v7
      id: signed-artifact
      with:
        name: plugins-signed-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: |
          ${{ runner.temp }}/plugins-signed/PPDS.Plugins.dll
          ${{ runner.temp }}/plugins-signed/signing-receipt.json
        if-no-files-found: error
        retention-days: 1

  verify-signed-plugins:
    name: Verify signed Plugins package
    needs: [build-package, sign-plugins]
    if: startsWith(github.ref, 'refs/tags/Plugins-v')
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.package-artifact.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.handoff.outputs.manifest-sha256 }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.build-package.outputs.artifact-id }}
        path: ${{ runner.temp }}/plugins-keyless
        merge-multiple: true
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.sign-plugins.outputs.artifact-id }}
        path: ${{ runner.temp }}/plugins-signed
        merge-multiple: true
    - name: Independently verify signature and reconstruct package
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_ID: ${{ needs.build-package.outputs.artifact-id }}
        BUILD_DIGEST: ${{ needs.build-package.outputs.artifact-digest }}
        BUILD_MANIFEST: ${{ needs.build-package.outputs.manifest-sha256 }}
        SIGN_ID: ${{ needs.sign-plugins.outputs.artifact-id }}
        SIGN_DIGEST: ${{ needs.sign-plugins.outputs.artifact-digest }}
        SIGN_MANIFEST: ${{ needs.sign-plugins.outputs.manifest-sha256 }}
      run: >-
        python -I scripts/ci/verify_plugin_signing.py verify --directory "$RUNNER_TEMP/plugins-keyless"
        --signed "$RUNNER_TEMP/plugins-signed" --output "$RUNNER_TEMP/plugins-final"
        --chain-output "$RUNNER_TEMP/plugins-chain.json" --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA"
        --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$BUILD_ID"
        --artifact-digest "$BUILD_DIGEST" --manifest-sha "$BUILD_MANIFEST"
        --sign-artifact-id "$SIGN_ID" --sign-artifact-digest "$SIGN_DIGEST" --sign-manifest-sha "$SIGN_MANIFEST"
    - name: Apply full release input and signature guard
      shell: bash
      run: python scripts/ci/verify_release_inputs.py nuget --tag "$GITHUB_REF_NAME" --directory "$RUNNER_TEMP/plugins-final"
    - name: Bind independently verified Plugins output
      id: handoff
      shell: bash
      run: >-
        python -I scripts/ci/verify_nuget_handoff.py create --directory "$RUNNER_TEMP/plugins-final"
        --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
        --attempt "$GITHUB_RUN_ATTEMPT" --chain "$RUNNER_TEMP/plugins-chain.json"
    - uses: actions/upload-artifact@v7
      id: package-artifact
      with:
        name: nuget-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: |
          ${{ runner.temp }}/plugins-final/*.nupkg
          ${{ runner.temp }}/plugins-final/*.snupkg
          ${{ runner.temp }}/plugins-final/nuget-handoff.json
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: [build-package, verify-signed-plugins]
    if: >-
      always() && needs.build-package.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/Plugins-v') && needs.verify-signed-plugins.result == 'success' && needs.verify-signed-plugins.outputs.artifact-id != '') ||
       (!startsWith(github.ref, 'refs/tags/Plugins-v') && needs.verify-signed-plugins.result == 'skipped' && needs.build-package.outputs.artifact-id != '')) &&
      github.repository == 'joshsmithxrm/power-platform-developer-suite' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      (startsWith(github.ref, 'refs/tags/Plugins-v') ||
       startsWith(github.ref, 'refs/tags/Dataverse-v') ||
       startsWith(github.ref, 'refs/tags/Migration-v') ||
       startsWith(github.ref, 'refs/tags/Auth-v') ||
       startsWith(github.ref, 'refs/tags/Cli-v') ||
       startsWith(github.ref, 'refs/tags/Query-v') ||
       startsWith(github.ref, 'refs/tags/Mcp-v'))
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      tag: ${{ steps.verify-handoff.outputs.tag }}
      package: ${{ steps.verify-handoff.outputs.package }}
    steps:
    - name: Checkout only the source-pinned data verifier
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          scripts/ci/verify_nuget_handoff.py
          scripts/ci/plugin-signing-policy.json
        sparse-checkout-cone-mode: false
    - name: Setup NuGet upload CLI
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    - name: Setup data verifier
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Download this run's exact package artifact
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ startsWith(github.ref, 'refs/tags/Plugins-v') && needs.verify-signed-plugins.outputs.artifact-id || (!startsWith(github.ref, 'refs/tags/Plugins-v') && needs.build-package.outputs.artifact-id || '') }}
        path: ${{ runner.temp }}/nuget-publish
        merge-multiple: true
    - name: Verify source, producer job, package hashes, tag and vacancy without MSBuild
      id: verify-handoff
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HANDOFF_ARTIFACT_ID: ${{ startsWith(github.ref, 'refs/tags/Plugins-v') && needs.verify-signed-plugins.outputs.artifact-id || (!startsWith(github.ref, 'refs/tags/Plugins-v') && needs.build-package.outputs.artifact-id || '') }}
        HANDOFF_ARTIFACT_DIGEST: ${{ startsWith(github.ref, 'refs/tags/Plugins-v') && needs.verify-signed-plugins.outputs.artifact-digest || (!startsWith(github.ref, 'refs/tags/Plugins-v') && needs.build-package.outputs.artifact-digest || '') }}
        HANDOFF_MANIFEST_SHA256: ${{ startsWith(github.ref, 'refs/tags/Plugins-v') && needs.verify-signed-plugins.outputs.manifest-sha256 || (!startsWith(github.ref, 'refs/tags/Plugins-v') && needs.build-package.outputs.manifest-sha256 || '') }}
      run: >-
        python -I scripts/ci/verify_nuget_handoff.py verify --directory "$RUNNER_TEMP/nuget-publish"
        --tag "$GITHUB_REF_NAME" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
        --attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$HANDOFF_ARTIFACT_ID"
        --artifact-digest "$HANDOFF_ARTIFACT_DIGEST" --manifest-sha "$HANDOFF_MANIFEST_SHA256"
        --output "$RUNNER_TEMP/verified-nuget-handoff.json"

    - name: Validate trusted publishing identity
      shell: bash
      env:
        NUGET_PUBLISH_USER: JoshSmithMSFT
      run: |
        # This must be the individual policy creator, not its package owner.
        if [[ -z "${NUGET_PUBLISH_USER:-}" || ! "$NUGET_PUBLISH_USER" =~ ^[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::The publishing identity must be the confirmed individual NuGet policy creator."
          exit 1
        fi

    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: JoshSmithMSFT

    - name: Push packages to NuGet
      working-directory: ${{ runner.temp }}
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        for package in "$RUNNER_TEMP"/nuget-publish/*.nupkg; do
          echo "Pushing $package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --no-symbols
        done

    - name: Push symbols to NuGet
      working-directory: ${{ runner.temp }}
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        shopt -s nullglob
        for package in "$RUNNER_TEMP"/nuget-publish/*.snupkg; do
          echo "Pushing $package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        done
      continue-on-error: true

  verify-public-artifact:
    name: Verify public NuGet artifact
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Checkout release verifier
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Verify package from public NuGet
      shell: bash
      run: >-
        python scripts/ci/verify_public_release.py
        nuget
        --tag "${{ needs.publish.outputs.tag }}"
        --package "${{ needs.publish.outputs.package }}"
