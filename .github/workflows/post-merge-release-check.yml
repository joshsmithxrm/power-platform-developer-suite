name: Post-Merge Release Check

on:
  pull_request:
    types: [closed, labeled]
    branches: [main]
  # The co-release guard (extension-corelease-detection job below) compares the
  # latest Cli-v* and Extension-v* tags. A tag push is not a pull_request event,
  # so the pull_request trigger above can't see it — we extend the triggers
  # minimally with a Cli-v* tag push so the guard fires exactly when a new CLI
  # release lands. workflow_dispatch allows a manual re-check.
  push:
    tags:
      - 'Cli-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  patch-release-detection:
    name: Detect patch release need
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'release:patch')) ||
       (github.event.action == 'labeled' && github.event.label.name == 'release:patch'))
    concurrency:
      group: patch-release-record-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout analyzed merge commit
        uses: actions/checkout@v4
        with:
          # Keep ReleaseGraph discovery on the same revision as the semantic
          # diff below, even if another PR lands before this job starts.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          path: analyzed

      - name: Checkout pinned release automation
        uses: actions/checkout@v4
        with:
          # A late label can target a merge that predates these scripts. Pin
          # helpers to the revision containing the workflow that is executing.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure workflow-owned release labels
        run: python automation/scripts/ci/sync_release_labels.py --repo "$GITHUB_REPOSITORY"

      - name: Build explained release advisory
        id: evaluate
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python automation/scripts/ci/release_plan.py \
            --repo-root analyzed \
            --delivery-manifest automation/scripts/ci/release_surfaces.json \
            --base "${MERGE_SHA}^" \
            --head "${MERGE_SHA}" \
            --release-kind patch \
            --channel stable \
            --format json > release-plan.json
          python automation/scripts/ci/release_plan.py \
            --repo-root analyzed \
            --delivery-manifest automation/scripts/ci/release_surfaces.json \
            --base "${MERGE_SHA}^" \
            --head "${MERGE_SHA}" \
            --release-kind patch \
            --channel stable \
            --format markdown > release-plan.md
          echo "release_needed=$(jq -r '.release_needed' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "Release advisory:"
          cat release-plan.json

      - name: Find all existing patch release records
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 10000 \
            --json number,state,body \
            > existing-release-records.json

      - name: Prepare idempotent patch release record
        id: prepare
        run: |
          python automation/scripts/ci/patch_release_issue.py \
            --event "$GITHUB_EVENT_PATH" \
            --plan-json release-plan.json \
            --plan-markdown release-plan.md \
            --existing-issues existing-release-records.json \
            --title-out issue-title.txt \
            --body-out issue-body.md \
            --decision-out issue-decision.json
          echo "should_create=$(jq -r '.should_create' issue-decision.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason' issue-decision.json)" >> "$GITHUB_OUTPUT"

      - name: Create patch release issue
        if: steps.prepare.outputs.should_create == 'true'
        env:
          ISSUE_TITLE_FILE: issue-title.txt
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$(cat "$ISSUE_TITLE_FILE")" \
            --label "release:patch" \
            --body-file issue-body.md

      - name: Log decision when no issue is opened
        if: steps.prepare.outputs.should_create != 'true'
        run: echo "No patch release issue opened. Reason=${{ steps.prepare.outputs.reason }}"

  extension-corelease-detection:
    name: Detect missing Extension bundled-CLI refresh
    runs-on: ubuntu-latest
    # Fires on a Cli-v* tag push (and manual dispatch), never on the PR-close
    # path above — the two jobs are mutually exclusive by event.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure workflow-owned release labels
        run: python scripts/ci/sync_release_labels.py --repo "$GITHUB_REPOSITORY"

      - name: Check for existing open co-release issue
        id: open-issue
        run: |
          # Idempotency: reuse the same label-based dedup as the cadence check so
          # repeated runs never file a duplicate issue.
          OPEN_COUNT=$(gh issue list --label "release:extension-corelease" --state open --json number | jq 'length')
          echo "open_count=${OPEN_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Evaluate co-release guard
        id: evaluate
        run: |
          HAS_OPEN=""
          if [ "${{ steps.open-issue.outputs.open_count }}" -gt "0" ]; then
            HAS_OPEN="--has-open-issue"
          fi

          RESULT=$(python scripts/ci/check_extension_corelease.py ${HAS_OPEN})
          echo "Guard result: ${RESULT}"
          echo "should_open=$(echo "${RESULT}" | jq -r '.should_open_issue')" >> "$GITHUB_OUTPUT"
          echo "reason=$(echo "${RESULT}" | jq -r '.reason')" >> "$GITHUB_OUTPUT"

      - name: File Extension refresh issue
        if: steps.evaluate.outputs.should_open == 'true'
        run: |
          # Title/body derive only from the tag state, not the dedup flag, so we
          # regenerate them here without --has-open-issue.
          TITLE=$(python scripts/ci/check_extension_corelease.py --format title)
          BODY=$(python scripts/ci/check_extension_corelease.py --format body)

          gh issue create \
            --title "${TITLE}" \
            --body  "${BODY}" \
            --label "release:extension-corelease"

      - name: Log decision (no issue opened)
        if: steps.evaluate.outputs.should_open != 'true'
        run: |
          echo "No Extension co-release issue opened. Reason: ${{ steps.evaluate.outputs.reason }}"
