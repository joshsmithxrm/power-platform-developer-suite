name: Post-Merge Release Check

on:
  # pull_request_target supplies the base repository's write-capable token for
  # merged PRs from forks. The job below executes only workflow-sha automation;
  # the merged revision is checked out separately and treated as input data.
  pull_request_target:
    types: [closed, labeled]
    branches: [main]
  # Either half of a coordinated release can arrive last. Reconcile on both tag
  # events and serialize the issue actions below so sequential tag pushes
  # converge without racing.
  push:
    tags:
      - 'Cli-v*'
      - 'Extension-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  patch-release-detection:
    name: Detect patch release need
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'release:patch')) ||
       (github.event.action == 'labeled' && github.event.label.name == 'release:patch'))
    concurrency:
      group: patch-release-record-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout analyzed merge commit
        uses: actions/checkout@v4
        with:
          # Keep ReleaseGraph discovery on the same revision as the semantic
          # diff below, even if another PR lands before this job starts.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          path: analyzed
          persist-credentials: false

      - name: Checkout pinned release automation
        uses: actions/checkout@v4
        with:
          # A late label can target a merge that predates these scripts. Pin
          # helpers to the revision containing the workflow that is executing.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          path: automation
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure workflow-owned release labels
        run: python automation/scripts/ci/sync_release_labels.py --repo "$GITHUB_REPOSITORY"

      - name: Build explained release advisory
        id: evaluate
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python automation/scripts/ci/release_plan.py \
            --repo-root analyzed \
            --fallback-delivery-manifest automation/scripts/ci/release_surfaces.json \
            --base "${MERGE_SHA}^" \
            --head "${MERGE_SHA}" \
            --release-kind patch \
            --channel stable \
            --format json > release-plan.json
          python automation/scripts/ci/release_plan.py \
            --repo-root analyzed \
            --fallback-delivery-manifest automation/scripts/ci/release_surfaces.json \
            --base "${MERGE_SHA}^" \
            --head "${MERGE_SHA}" \
            --release-kind patch \
            --channel stable \
            --format markdown > release-plan.md
          echo "release_needed=$(jq -r '.release_needed' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "Release advisory:"
          cat release-plan.json

      - name: Find all existing patch release records
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "release:patch" \
            --state all \
            --limit 10000 \
            --json number,state,body,labels \
            > existing-release-records.json

      - name: Prepare idempotent patch release record
        id: prepare
        run: |
          python automation/scripts/ci/patch_release_issue.py \
            --event "$GITHUB_EVENT_PATH" \
            --plan-json release-plan.json \
            --plan-markdown release-plan.md \
            --existing-issues existing-release-records.json \
            --title-out issue-title.txt \
            --body-out issue-body.md \
            --decision-out issue-decision.json
          echo "should_create=$(jq -r '.should_create' issue-decision.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason' issue-decision.json)" >> "$GITHUB_OUTPUT"

      - name: Create patch release issue
        if: steps.prepare.outputs.should_create == 'true'
        env:
          ISSUE_TITLE_FILE: issue-title.txt
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$(cat "$ISSUE_TITLE_FILE")" \
            --label "release:patch" \
            --body-file issue-body.md

      - name: Log decision when no issue is opened
        if: steps.prepare.outputs.should_create != 'true'
        run: echo "No patch release issue opened. Reason=${{ steps.prepare.outputs.reason }}"

  extension-corelease-detection:
    name: Reconcile Extension bundled-CLI refresh
    runs-on: ubuntu-latest
    # Fires on CLI/Extension tag pushes (and manual dispatch), never on the
    # pull-request path above.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: extension-corelease-reconciliation
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ensure workflow-owned release labels
        run: python scripts/ci/sync_release_labels.py --repo "$GITHUB_REPOSITORY"

      - name: Find workflow-owned co-release records
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "release:extension-corelease" \
            --state all \
            --limit 10000 \
            --json number,state,body,labels \
            > existing-corelease-records.json

      - name: Reconcile co-release alerts
        run: |
          python scripts/ci/check_extension_corelease.py \
            --existing-issues existing-corelease-records.json \
            --repo "$GITHUB_REPOSITORY" \
            --apply
