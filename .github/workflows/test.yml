name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Explicitly qualify native/VSIX artifacts at the selected ref without publishing.
  # This also runs Python contracts, but does not claim full .NET/Extension qualification.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read # paths-filter lists changed files on pull requests.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'false' || steps.filter.outputs.code }}
      extraction: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.extraction }}
      python: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - '**.cs'
              - '**.csproj'
              - '**.sln'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
            extraction:
              - 'src/**'
              - 'tests/PPDS.Cli.Tests/**'
              - 'tests/fixtures/SingleFilePlugin/**'
              - 'tests/fixtures/ReferenceCacheProbe/**'
              - 'scripts/ci/smoke_single_file_extraction.py'
              - 'scripts/ci/verify_native_distribution.py'
              - 'scripts/ci/check_native_glibc.sh'
              - '.github/workflows/extension-publish.yml'
              - 'Directory.*.props'
              - 'global.json'
              - 'NuGet.config'
              - '.github/workflows/test.yml'
              - '.github/workflows/release-cli.yml'
              - '.github/workflows/publish-nuget.yml'
            python:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - '.claude/**'
              - 'specs/**'
              - 'docs/**'
              - 'CLAUDE.md'
              - 'CONTRIBUTING.md'
              - 'README.md'
              - 'package*.json'
              - 'Directory.*.props'
              - 'global.json'
              - 'NuGet.config'
              - 'nuget.config'
              - '.github/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'setup.cfg'
              - 'tox.ini'
              - '**/conftest.py'
              - '**/requirements*.txt'
              - 'uv.lock'
              - 'poetry.lock'

  python-tests:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/workflow-tests.yml

  test:
    name: ${{ github.event_name == 'workflow_dispatch' && '.NET tests not selected for artifact qualification' || 'test' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 0  # Required for MinVer to read git history

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # Pin current SDKs to use the official versioned feed while aka.ms redirects are broken.
        dotnet-version: |
          8.0.427
          9.0.320
          10.0.403

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/http-cache
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'nuget.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test with Coverage
      run: |
        dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage
        flags: unittests
        fail_ci_if_error: false  # Don't fail build if upload fails
        verbose: true

  single-file-extraction:
    name: Single-file extraction (${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.extraction == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, binary: ppds }
          - { os: windows-latest, rid: win-x64, binary: ppds.exe }
          - { os: windows-11-arm, rid: win-arm64, binary: ppds.exe }
          - { os: macos-15-intel, rid: osx-x64, binary: ppds }
          - { os: macos-15, rid: osx-arm64, binary: ppds }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          # Match global.json's 10.0.1xx feature band; pin around broken channel redirects.
          dotnet-version: |
            8.0.427
            10.0.114
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build deterministic local plugin fixture
        run: dotnet build tests/fixtures/SingleFilePlugin/SingleFilePlugin.csproj -c Release
      - name: Build read-only cache location probe
        run: dotnet build tests/fixtures/ReferenceCacheProbe/ReferenceCacheProbe.csproj -c Release
      - name: Publish with shipped single-file settings
        run: >-
          dotnet publish src/PPDS.Cli/PPDS.Cli.csproj -c Release -f net10.0
          -r ${{ matrix.rid }} -p:PublishSingleFile=true --self-contained -o ./publish
      - name: Verify actual single-file extraction
        run: >-
          python scripts/ci/smoke_single_file_extraction.py
          --binary ./publish/${{ matrix.binary }}
          --fixture tests/fixtures/SingleFilePlugin/bin/Release/net462
          --cache-probe tests/fixtures/ReferenceCacheProbe/bin/Release/net8.0/ReferenceCacheProbe.dll
          --reference-archive src/PPDS.Cli/obj/Release/net10.0/${{ matrix.rid }}/Net462ReferenceAssemblies.zip
      - name: Verify actual native runtime and daemon without profiles
        run: >-
          python scripts/ci/verify_native_distribution.py native
          --binary ./publish/${{ matrix.binary }} --rid ${{ matrix.rid }} --source ${{ github.sha }}
          --evidence ${{ runner.temp }}/ppds-native-${{ matrix.rid }}
      - name: Verify actual Linux payload on UBI8 glibc2.28
        if: matrix.rid == 'linux-x64'
        run: >-
          python scripts/ci/verify_native_distribution.py glibc
          --binary ./publish/ppds --rid linux-x64 --source ${{ github.sha }}
          --evidence ${{ runner.temp }}/ppds-glibc
      - name: Retain native candidate provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-distribution-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/ppds-native-${{ matrix.rid }}/*.json
            ${{ runner.temp }}/ppds-native-${{ matrix.rid }}/*.log
            ${{ runner.temp }}/ppds-glibc/*.json
            ${{ runner.temp }}/ppds-glibc/*.log
          retention-days: 7
      # Run after the smoke so unit tests cannot prepopulate its actual account cache.
      - name: Run portable extraction unit tests
        run: >-
          dotnet test tests/PPDS.Cli.Tests/PPDS.Cli.Tests.csproj -c Release -f net10.0
          --filter FullyQualifiedName~PPDS.Cli.Tests.Plugins.Extraction
          -p:VSTestTreatNoTestsAsError=true --logger "console;verbosity=normal"

  vsix-artifacts:
    name: Candidate VSIX (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.extraction == 'true'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, rid: win-x64, binary: ppds.exe }
          - { os: ubuntu-latest, target: linux-x64, rid: linux-x64, binary: ppds }
          - { os: macos-15-intel, target: darwin-x64, rid: osx-x64, binary: ppds }
          - { os: macos-15, target: darwin-arm64, rid: osx-arm64, binary: ppds }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.427
            10.0.114
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked packaging tools without lifecycle scripts
        working-directory: src/PPDS.Extension
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run extension typecheck, lint and actual unit tests
        working-directory: src/PPDS.Extension
        run: |
          npm run typecheck:all
          npm run lint
          npm test
      - name: Build local extraction fixtures
        run: |
          dotnet build tests/fixtures/SingleFilePlugin/SingleFilePlugin.csproj -c Release
          dotnet build tests/fixtures/ReferenceCacheProbe/ReferenceCacheProbe.csproj -c Release
      - name: Bundle actual candidate CLI without release version overrides
        working-directory: src/PPDS.Extension
        run: node tools/bundle-cli.mjs --rid ${{ matrix.rid }}
      - name: Record compiled candidate identity
        run: >-
          python scripts/ci/verify_native_distribution.py manifest
          --binary src/PPDS.Extension/bin/${{ matrix.binary }} --rid ${{ matrix.rid }} --source ${{ github.sha }}
          --evidence ${{ runner.temp }}/ppds-vsix-build-${{ matrix.rid }}
      - name: Package candidate archive without publishing
        working-directory: src/PPDS.Extension
        run: >-
          node node_modules/@vscode/vsce/vsce package --target ${{ matrix.target }}
          --out ppds-validation-${{ matrix.target }}.vsix
      - name: Verify and execute actual archived native payload
        run: >-
          python scripts/ci/verify_native_distribution.py vsix
          --binary src/PPDS.Extension/bin/${{ matrix.binary }} --rid ${{ matrix.rid }} --source ${{ github.sha }}
          --target ${{ matrix.target }} --vsix src/PPDS.Extension/ppds-validation-${{ matrix.target }}.vsix
          --evidence ${{ runner.temp }}/ppds-vsix-${{ matrix.rid }}
      - name: Retain candidate archive and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-vsix-${{ matrix.target }}
          path: |
            src/PPDS.Extension/ppds-validation-${{ matrix.target }}.vsix
            ${{ runner.temp }}/ppds-vsix-build-${{ matrix.rid }}/*.json
            ${{ runner.temp }}/ppds-vsix-${{ matrix.rid }}/*.json
            ${{ runner.temp }}/ppds-vsix-${{ matrix.rid }}/*.log
          retention-days: 7

      - name: Retain small candidate provenance without the VSIX binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-vsix-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/ppds-vsix-build-${{ matrix.rid }}/*.json
            ${{ runner.temp }}/ppds-vsix-${{ matrix.rid }}/*.json
            ${{ runner.temp }}/ppds-vsix-${{ matrix.rid }}/*.log
          retention-days: 7

  # Gate job for branch protection
  test-status:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Native candidate qualification' || 'test-status' }}
    permissions:
      contents: read # Read the tested aggregate evaluator; no write grant.
    runs-on: ubuntu-latest
    needs: [changes, test, single-file-extraction, vsix-artifacts, python-tests]
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check test status
        env:
          TEST_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_test_status.py
