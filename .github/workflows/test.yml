name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      extraction: ${{ steps.filter.outputs.extraction }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**.cs'
              - '**.csproj'
              - '**.sln'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
            extraction:
              - 'src/**'
              - 'tests/PPDS.Cli.Tests/**'
              - 'tests/fixtures/SingleFilePlugin/**'
              - 'tests/fixtures/ReferenceCacheProbe/**'
              - 'scripts/ci/smoke_single_file_extraction.py'
              - 'Directory.*.props'
              - 'global.json'
              - 'NuGet.config'
              - '.github/workflows/test.yml'
              - '.github/workflows/release-cli.yml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Required for MinVer to read git history

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # Pin current SDKs to use the official versioned feed while aka.ms redirects are broken.
        dotnet-version: |
          8.0.427
          9.0.320
          10.0.403

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/http-cache
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'nuget.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test with Coverage
      run: |
        dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage
        flags: unittests
        fail_ci_if_error: false  # Don't fail build if upload fails
        verbose: true

  single-file-extraction:
    name: Single-file extraction (${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.extraction == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, binary: ppds }
          - { os: windows-latest, rid: win-x64, binary: ppds.exe }
          - { os: windows-11-arm, rid: win-arm64, binary: ppds.exe }
          - { os: macos-15-intel, rid: osx-x64, binary: ppds }
          - { os: macos-15, rid: osx-arm64, binary: ppds }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          # Match global.json's 10.0.1xx feature band; pin around broken channel redirects.
          dotnet-version: |
            8.0.427
            10.0.114
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build deterministic local plugin fixture
        run: dotnet build tests/fixtures/SingleFilePlugin/SingleFilePlugin.csproj -c Release
      - name: Build read-only cache location probe
        run: dotnet build tests/fixtures/ReferenceCacheProbe/ReferenceCacheProbe.csproj -c Release
      - name: Publish with shipped single-file settings
        run: >-
          dotnet publish src/PPDS.Cli/PPDS.Cli.csproj -c Release -f net8.0
          -r ${{ matrix.rid }} -p:PublishSingleFile=true --self-contained -o ./publish
      - name: Verify actual single-file extraction
        run: >-
          python scripts/ci/smoke_single_file_extraction.py
          --binary ./publish/${{ matrix.binary }}
          --fixture tests/fixtures/SingleFilePlugin/bin/Release/net462
          --cache-probe tests/fixtures/ReferenceCacheProbe/bin/Release/net8.0/ReferenceCacheProbe.dll
          --reference-archive src/PPDS.Cli/obj/Release/net8.0/${{ matrix.rid }}/Net462ReferenceAssemblies.zip
      # Run after the smoke so unit tests cannot prepopulate its actual account cache.
      - name: Run portable extraction unit tests
        run: >-
          dotnet test tests/PPDS.Cli.Tests/PPDS.Cli.Tests.csproj -c Release -f net8.0
          --filter FullyQualifiedName~PPDS.Cli.Tests.Plugins.Extraction
          -p:VSTestTreatNoTestsAsError=true --logger "console;verbosity=normal"

  # Gate job for branch protection
  test-status:
    runs-on: ubuntu-latest
    needs: [changes, test, single-file-extraction]
    if: always()
    steps:
      - name: Check test status
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Changes detection failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.extraction }}" == "true" && "${{ needs.single-file-extraction.result }}" != "success" ]]; then
            echo "Single-file extraction failed: ${{ needs.single-file-extraction.result }}"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped" ]]; then
            echo "Tests passed"
            exit 0
          else
            echo "Tests failed: ${{ needs.test.result }}"
            exit 1
          fi
