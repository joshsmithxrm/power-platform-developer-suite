name: Integration Tests

# No automatic events or live executor while fixture safety remains unresolved.
# Dispatch is diagnostic only: it cannot authorize or run a live test.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  integration-tests-hold:
    name: Integration Tests (held)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse live execution
        shell: bash
        run: |
          echo "::error::Live integration validation is held; no live tests were run."
          echo "Requires exact source/target/suite authorization and reviewed fixture ownership/cleanup safety or an approved exclusive disposable environment lifecycle."
          exit 1
