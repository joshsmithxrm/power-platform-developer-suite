# =============================================================================
# Security: CodeQL Analysis
# =============================================================================
# Performs semantic code analysis to find security vulnerabilities and
# code quality issues in the C# code, and security vulnerabilities in the
# VS Code extension's TypeScript.
#
# Triggers:
#   - Push to main branch
#   - Pull requests to main
#   - Weekly schedule (Monday 9 AM UTC)
#
# For more info: https://docs.github.com/en/code-security/code-scanning
# =============================================================================

name: 'Security: CodeQL'

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.cs'
      - '**/*.csproj'
      - '*.sln'
      - 'src/PPDS.Extension/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.cs'
      - '**/*.csproj'
      - '*.sln'
      - 'src/PPDS.Extension/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'

  schedule:
    # Weekly scan on Monday at 9 AM UTC
    - cron: '0 9 * * 1'

  workflow_dispatch:

jobs:
  analyze:
    name: Analyze ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            name: 'C#'
            config: ./.github/codeql/codeql-config.yml
          # The extension's TypeScript needs no build for analysis.
          - language: javascript-typescript
            name: TypeScript
            config: ./.github/codeql/codeql-typescript-config.yml

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Each language has its own config: paths, exclusions and query suite.
          config-file: ${{ matrix.config }}

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.115'

      - name: Build solution
        if: matrix.language == 'csharp'
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
