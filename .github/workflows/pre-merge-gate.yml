name: Pre-Merge Gate

# Enforces one rule before any PR is merged into main, per the v1-launch
# retro (item #11), and reports PR size for information.
#
# Rule 3 (major dependency evidence): scripts/ci/check_major_bump_tested.py
# selects evidence by dependency ecosystem; it does not require unrelated
# product tests. It is ENFORCING (no soft-warn) and has no bypass marker.
# (Rule 2 — workflow secret-ref drift — was retired; numbering preserved.)
#
# PR size (scripts/ci/check_pr_size.py) is INFORMATIONAL: it writes the
# numbers to the job log and step summary, always exits 0, and is not part of
# the aggregate result. See docs/MERGE-POLICY.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: pre-merge-gate-${{ github.event.pull_request.number }}
  # Only an event that can bring a new head commit (opened, synchronize,
  # reopened) cancels the run in progress: a run on a superseded head is
  # obsolete. `ready_for_review` and `edited` keep the head commit, so they do
  # not cancel. Cancelling for an edit left a cancelled Rule 3 job and a failed
  # `Pre-Merge Gate` aggregate (it runs on `always()`) on the PR (#1685).
  # Rule 3 reads the PR title and body, so an edit is still evaluated: its run
  # waits in the group's single pending slot and starts when the run in
  # progress ends, so its result is the newest. A later event replaces a run
  # still waiting there, so the newest edit is the one evaluated.
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' && github.event.action != 'edited' }}

jobs:
  size:
    name: PR size (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Report PR size (never fails)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ci/check_pr_size.py --pr "$PR_NUMBER"

  major-bump-tested:
    name: Rule 3 — Major dependency evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check major-bump test enforcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ci/check_major_bump_tested.py --pr "$PR_NUMBER"

  # Aggregate gate. It succeeds iff every enforcing rule passes. The size job
  # is informational and deliberately not a dependency.
  pre-merge-gate:
    name: Pre-Merge Gate
    runs-on: ubuntu-latest
    needs: [major-bump-tested]
    if: always()
    steps:
      - name: Aggregate
        run: |
          if [[ "${{ needs.major-bump-tested.result }}" == "success" ]]; then
            echo "All pre-merge gate rules passed."
            exit 0
          fi
          echo "Pre-merge gate failed:"
          echo "  major-bump-tested: ${{ needs.major-bump-tested.result }}"
          exit 1
