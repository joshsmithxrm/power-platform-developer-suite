name: Decision Link Check

# Issue #1790: a sentence that a pull request adds or changes in specs/,
# docs/releases/ or a package CHANGELOG, and that states an approval, an
# exception, a removal or a date, links the maintainer's decision or is marked
# "proposed" (docs/VERSIONING.md rule 9.1). The phrases are listed once, in
# scripts/ci/check_decision_links.py. See docs/MERGE-POLICY.md.
#
# NOT a required status check. The script reads git only; it calls no GitHub
# API, so the job needs only `contents: read`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths filter: a required check must report on every pull request.
    # With nothing in scope the script passes in a second.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: decision-link-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decision-links:
    name: Decision text links its decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Both the base and the PR head are needed to diff the documents.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check decision links in changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci/check_decision_links.py --base "$BASE_SHA" --head "$HEAD_SHA"
